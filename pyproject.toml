[project]
name = "smbuilder"
version = "0.6.1"
description = "Generate code to run statemachine defined in .smb files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
sm-compiler = "sm_compiler:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["sm_compiler"]
packages = ["codegen"]

[tool.setuptools.data-files]
# Installed on POSIX (Linux/macOS) to {prefix}/share/man/man1/.
# On Windows the file is placed but no 'man' command exists, so it is harmless.
# With 'uv tool install' the prefix is the tool's isolated venv; add
# ~/.local/share/uv/tools/smbuilder/share/man/man1 to MANPATH to use it there.
"share/man/man1" = ["sm-compiler.1"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
